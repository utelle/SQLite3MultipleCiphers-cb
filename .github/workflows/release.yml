name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        type: choice
        default: dry-run
        options:
          - sanity
          - dry-run
          - release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # -------------------------------------------------------------------
  # TRUSTED BUILDER (reusable workflow): builds the binaries, signs the
  # Windows binaries via SignPath and generates the SLSA build provenance,
  # isolated from this caller workflow.
  #
  # Union grant: the permissions below are the UNION of what the jobs inside
  # build-reusable.yml need (a called workflow can only downgrade, never
  # elevate, the caller's grant). Only the assemble job inside the reusable
  # workflow actually uses id-token/attestations: write; the publish job
  # below never holds them.
  # -------------------------------------------------------------------
  build:
    permissions:
      contents: read
      actions: read         # SignPath artifact hand-off in the build job
      id-token: write       # assemble job: OIDC for keyless Sigstore signing
      attestations: write   # assemble job: write build provenance attestation
    uses: ./.github/workflows/build-reusable.yml
    with:
      mode: ${{ inputs.mode }}
    secrets:
      MUSL_CC_BIN: ${{ secrets.MUSL_CC_BIN }}
      # Forwarded to the SignPath code-signing step inside the reusable build workflow
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  # -------------------------------------------------------------------
  # PUBLISHER: consumes the already-built, already-attested release bundle
  # and publishes it (signed tag + GitHub release). No attestation here.
  # -------------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write       # create signed tag + GitHub release

    env:
      MODE: ${{ inputs.mode }}

    steps:

    # -------------------------------------------------
    # Checkout repository
    # -------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # -------------------------------------------------
    # Read version (composite action; exports $VERSION)
    # -------------------------------------------------
    - name: Read version
      uses: ./.github/actions/read-version

    # -------------------------------------------------
    # Resolve archive name
    # Runs in ALL modes (also sanity, where no bundle exists) so that
    # $ARCHIVE_NAME is always defined for the mode info step below.
    # -------------------------------------------------
    - name: Resolve archive name
      run: |
        set -euo pipefail
        echo "ARCHIVE_NAME=release-$VERSION.tar.gz" >> $GITHUB_ENV

    # -------------------------------------------------
    # DOWNLOAD RELEASE BUNDLE (built & attested by the trusted builder)
    # -------------------------------------------------
    - name: Download release bundle
      if: ${{ inputs.mode != 'sanity' }}
      uses: actions/download-artifact@v8
      with:
        name: release-bundle
        path: bundle

    # -------------------------------------------------
    # STAGE RELEASE BUNDLE
    # upload-artifact keeps paths relative to their common root, so the
    # bundle contains release-<version>.tar.gz at its root plus
    # release/SHA256SUMS.txt and release/manifest.json. Restore exactly
    # the layout the gh-release files list below expects.
    # -------------------------------------------------
    - name: Stage release bundle
      if: ${{ inputs.mode != 'sanity' }}
      run: |
        set -euo pipefail
        mkdir -p release
        mv "bundle/$ARCHIVE_NAME" "$ARCHIVE_NAME"
        mv bundle/release/SHA256SUMS.txt release/
        mv bundle/release/manifest.json release/
        ls -l "$ARCHIVE_NAME" release/

    # -------------------------------------------------
    # MODE INFO
    # -------------------------------------------------
    - name: Release mode info
      run: |
        set -euo pipefail
        echo "=============================="
        echo "MODE: $MODE"
        echo "VERSION: $VERSION"
        echo "ARCHIVE: $ARCHIVE_NAME"
        echo "=============================="

        case "$MODE" in
          sanity)
            echo "🔎 SANITY CHECK MODE (no side effects)"
            ;;
          dry-run)
            echo "🧪 DRY RUN MODE (signing tested, no release)"
            ;;
          release)
            echo "🚀 REAL RELEASE MODE (will publish)"
            ;;
        esac

    # -------------------------------------------------
    # SANITY MODE (no git, no gpg)
    # -------------------------------------------------
    - name: Sanity check environment
      if: ${{ inputs.mode == 'sanity' }}
      run: |
        set -euo pipefail
        echo "Checking toolchain only..."
        git --version
        gpg --version
        echo "Sanity check complete."

    # -------------------------------------------------
    # GIT + GPG SETUP incl. dry-run validation (composite action;
    # skipped entirely in sanity mode)
    # -------------------------------------------------
    - name: Set up GPG signing
      if: ${{ inputs.mode != 'sanity' }}
      uses: ./.github/actions/setup-signing
      with:
        git-user-name: ${{ vars.GIT_USER_NAME }}
        git-user-email: ${{ vars.GIT_USER_EMAIL }}
        gpg-key-id: ${{ vars.GPG_KEY_ID }}
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        validate: ${{ inputs.mode == 'dry-run' }}

    # -------------------------------------------------
    # Create signed tag for release
    # -------------------------------------------------
    - name: Create signed tag
      if: ${{ inputs.mode == 'release' }}
      run: |
        set -euo pipefail
        if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
          echo "::error::Tag $VERSION already exists"
          exit 1
        fi
        git tag -s "$VERSION" -m "Release $VERSION"
        git push origin "$VERSION"

    # -------------------------------------------------
    # Create GitHub release
    # -------------------------------------------------
    - name: Create GitHub Release
      if: ${{ inputs.mode == 'release' }}
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        tag_name: ${{ env.VERSION }}
        files: |
          ${{ env.ARCHIVE_NAME }}
          release/SHA256SUMS.txt
          release/manifest.json
