name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        type: choice
        default: dry-run
        options:
          - sanity
          - dry-run
          - release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yml
    secrets:
      MUSL_CC_BIN: ${{ secrets.MUSL_CC_BIN }}
      # Forwarded to the SignPath code-signing step inside the reusable build workflow
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write       # OIDC token for keyless Sigstore signing
      attestations: write   # write build provenance attestation

    env:
      MODE: ${{ inputs.mode }}

    steps:

    # -------------------------------------------------
    # Checkout repository
    # -------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Read version from versioninfo.json
      id: version
      run: |
        set -euo pipefail

        VERSION_MAJOR=$(jq -r '.VersionMajor' bld/versioninfo.json)
        VERSION_MINOR=$(jq -r '.VersionMinor' bld/versioninfo.json)
        VERSION_PATCH=$(jq -r '.VersionPatch' bld/versioninfo.json)

        # For actual releases only major, minor, and patch are used
        VERSION="v${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"

        echo "VERSION=$VERSION" >> $GITHUB_ENV
        #echo "version=$VERSION" >> $GITHUB_OUTPUT

        echo "Resolved version: $VERSION"

    # -------------------------------------------------
    # DOWNLOAD BUILD ARTIFACTS
    # -------------------------------------------------
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: bin-*
        merge-multiple: true
        path: release

    # -------------------------------------------------
    # FIX PERMISSIONS (shared libs etc.)
    # -------------------------------------------------
    - name: Fix permissions
      run: |
        set -euo pipefail
        find ./release -type f \( -name "*.so" -o -name "*.dylib" \) -exec chmod 0775 {} +

    # -------------------------------------------------
    # CHECKSUMS (for individual files)
    # -------------------------------------------------
    - name: Generate checksums
      run: |
        set -euo pipefail
        cd release
        find . -type f \
          ! -name "SHA256SUMS.txt" \
            -print0 \
          | sort -z \
          | xargs -0 sha256sum \
          | sed 's|^\([^ ]*\)  \./|\1  |' \
          > SHA256SUMS.txt

    # -------------------------------------------------
    # RELEASE SNAPSHOT ARCHIVE
    # -------------------------------------------------
    - name: Create release snapshot archive
      run: |
        set -euo pipefail
        ARCHIVE="release-$VERSION.tar.gz"
        tar -czf "$ARCHIVE" -C release .

        echo "ARCHIVE_NAME=$ARCHIVE" >> $GITHUB_ENV

    # -------------------------------------------------
    # CHECKSUM OF SNAPSHOT ARCHIVE (important!)
    # -------------------------------------------------
    - name: Add archive checksum to manifest source
      run: |
        set -euo pipefail
        sha256sum "$ARCHIVE_NAME" >> release/SHA256SUMS.txt

    # -------------------------------------------------
    # MANIFEST GENERATION
    # -------------------------------------------------
    - name: Generate release manifest
      run: |
        set -euo pipefail
        cat > release/manifest.json <<EOF
        {
          "version": "$VERSION",
          "mode": "${{ inputs.mode }}",
          "archive": "$ARCHIVE_NAME",
          "files": [
        EOF

        find release -type f \
          ! -name "manifest.json" \
          ! -name "SHA256SUMS.txt" \
          | sed 's|release/||' \
          | sort \
          | sed 's/.*/"&"/' \
          | paste -sd "," - \
          >> release/manifest.json

        echo "" >> release/manifest.json
        echo "  ]" >> release/manifest.json
        echo "}" >> release/manifest.json

    # -------------------------------------------------
    # UPLOAD CHECKSUMS AND MANIFEST
    # -------------------------------------------------
    - name: Upload checksums and manifest
      uses: actions/upload-artifact@v7
      with:
        name: release-metadata-${{ env.VERSION }}
        path: |
          release/SHA256SUMS.txt
          release/manifest.json 

    # -------------------------------------------------
    # MODE INFO
    # -------------------------------------------------
    - name: Release mode info
      run: |
        set -euo pipefail
        echo "=============================="
        echo "MODE: $MODE"
        echo "VERSION: $VERSION"
        echo "ARCHIVE: $ARCHIVE_NAME"
        echo "=============================="

        case "$MODE" in
          sanity)
            echo "🔎 SANITY CHECK MODE (no side effects)"
            ;;
          dry-run)
            echo "🧪 DRY RUN MODE (signing tested, no release)"
            ;;
          release)
            echo "🚀 REAL RELEASE MODE (will publish)"
            ;;
        esac

    # -------------------------------------------------
    # SANITY MODE (no git, no gpg)
    # -------------------------------------------------
    - name: Sanity check environment
      if: ${{ inputs.mode == 'sanity' }}
      run: |
        set -euo pipefail
        echo "Checking toolchain only..."
        git --version
        gpg --version
        echo "Sanity check complete."

    # -------------------------------------------------
    # GIT + GPG SETUP (only non-sanity)
    # -------------------------------------------------
    - name: Configure Git
      if: ${{ inputs.mode != 'sanity' }}
      run: |
        set -euo pipefail
        git config user.name "${{ vars.GIT_USER_NAME }}"
        git config user.email "${{ vars.GIT_USER_EMAIL }}"
        git config user.signingkey "${{ vars.GPG_KEY_ID }}"
        git config commit.gpgsign true

    - name: Import GPG key
      if: ${{ inputs.mode != 'sanity' }}
      run: |
        set -euo pipefail
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

    # -------------------------------------------------
    # DRY RUN VALIDATION
    # -------------------------------------------------
    - name: Dry-run signing validation
      if: ${{ inputs.mode == 'dry-run' }}
      run: |
        set -euo pipefail
        echo "Testing GPG setup..."
        gpg --list-secret-keys --keyid-format=long

        echo "Testing commit signing..."
        git commit --allow-empty -S -m "dry-run signing test"

        echo "Verifying signature..."
        git log -1 --show-signature

    # -------------------------------------------------
    # GENERATE SLSA-ALIGNED BUILD PROVENANCE
    # -------------------------------------------------
    - name: Generate build provenance
      if: ${{ inputs.mode == 'release' }}
      uses: actions/attest-build-provenance@v4
      with:
        # Attest the snapshot archive that the -NuGet repo consumes & verifies.
        # (Add individual binary globs here if you also want per-file attestation.)
        subject-path: ${{ env.ARCHIVE_NAME }}

    # -------------------------------------------------
    # Create signed tag for release
    # -------------------------------------------------
    - name: Create signed tag
      if: ${{ inputs.mode == 'release' }}
      run: |
        set -euo pipefail
        if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
          echo "::error::Tag $VERSION already exists"
          exit 1
        fi
        git tag -s "$VERSION" -m "Release $VERSION"
        git push origin "$VERSION"

    # -------------------------------------------------
    # Create GitHub release
    # -------------------------------------------------
    - name: Create GitHub Release
      if: ${{ inputs.mode == 'release' }}
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        tag_name: ${{ env.VERSION }}
        files: |
          ${{ env.ARCHIVE_NAME }}
          release/SHA256SUMS.txt
          release/manifest.json
