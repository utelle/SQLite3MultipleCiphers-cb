name: Reusable Build

on:
  workflow_call:
    secrets:
      MUSL_CC_BIN:
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:

    # -------------------------------------------------
    # Checkout repository
    # -------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        path: "cb"

    # -------------------------------------------------
    # Download musl-cc binaries
    # -------------------------------------------------
    - name: Download musl-cc binaries
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        echo "${{ secrets.MUSL_CC_BIN }}" | gh auth login --with-token
        mkdir -p musl-cc
        gh release download v1.0.0 \
          --repo utelle/musl-cc-binaries-priv \
          --dir musl-cc \
          --pattern "*.tgz"

    # -------------------------------------------------
    # Setup cross compilers
    # -------------------------------------------------
    - name: Setup cross compilers
      if: startsWith(matrix.os, 'ubuntu')
      run: ./cb/bld/setup_linux.sh

    # -------------------------------------------------
    # Setup Android NDK
    # -------------------------------------------------
    - name: Setup NDK
      if: startsWith(matrix.os, 'ubuntu')
      uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
      with:
        ndk-version: r26d

    # -------------------------------------------------
    # Setup .Net environment
    # -------------------------------------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0

    # -------------------------------------------------
    # Show installed Visual Studio instances
    # -------------------------------------------------
    - name: Show installed Visual Studio instances
      if: startsWith(matrix.os, 'windows')
      run: |
        & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json
      shell: pwsh

    # -------------------------------------------------
    # Generate build scripts
    # -------------------------------------------------
    - name: Generate script
      run: dotnet run
      working-directory: cb/bld

#    - name: Show contents of .linkargs file
#      if: startsWith(matrix.os, 'windows')
#      run: |
#        type cb\bld\win_sqlite3mc_v143_plain_x64.rc
#        powershell -c "Format-Hex cb\bld\win_sqlite3mc_v143_plain_x64.rc | Select-Object -First 50"
#        type cb\bld\win_sqlite3mc_v143_plain_x64.linkargs
#        type cb\bld\win_sqlite3mc_v143_plain_x86.linkargs

    # -------------------------------------------------
    # Update permissions for build scripts
    # -------------------------------------------------
    - name: Update permissions
      run: chmod +x *.sh 
      working-directory: cb/bld

    # -------------------------------------------------
    # Clean output directory for Linux and macOS builds
    # -------------------------------------------------
    - name: Clean output directory
      if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
      run: rm -fr bin
      working-directory: cb/bld

    # -------------------------------------------------
    # Checkout repository for Windows builds
    # -------------------------------------------------
    - name: Clean output directory
      if: startsWith(matrix.os, 'windows')
      run: rm bin -r -fo
      working-directory: cb/bld

    # -------------------------------------------------
    # Build Linux binaries
    # -------------------------------------------------
    - name: Build (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        #!/bin/bash
        export PATH="$PWD/../../crosscompilers/bin:$PATH"
        set -e
        for f in linux_*.sh; do
          if [[ "$f" == *_cross.sh ]] || [[ "$f" == *_regular.sh ]]
          then
            continue
          fi
          bash "$f"
        done
      working-directory: cb/bld

    # -------------------------------------------------
    # Build Android binaries
    # -------------------------------------------------
    - name: Build (Android)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        set -e
        cd android_sqlite3mc
        ndk-build
        mkdir -p ../bin/sqlite3mc/android
        cp -r libs/* ../bin/sqlite3mc/android
      working-directory: cb/bld

    # -------------------------------------------------
    # Build binaries for macOS, iOS, and tvOS
    # -------------------------------------------------
    - name: Build (macOS, iOS, tvOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        set -e
        for f in mac_*.sh maccatalyst_*.sh ios_*.sh tvos_*.sh; do
          bash "$f"
        done
      working-directory: cb/bld

    # -------------------------------------------------
    # Build Windows binaries
    # -------------------------------------------------
    - name: Build (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        $files = Get-ChildItem *.bat -Exclude "win_e_sqlite3mc.bat","win_sqlite3mc.bat"
        foreach ($f in $files) {
          cmd /C $f
        }
      working-directory: cb/bld

    # -------------------------------------------------
    # Upload artifacts
    # -------------------------------------------------
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: bin-${{ matrix.os }}
        path: cb/bld/bin

  build-wasm:
    strategy:
      fail-fast: false
      matrix:
        config:
          # Don't forget to add a download-artifact steps in test and publish
        - '{ "tfm": "net6.0", "emsdk": "2.0.23" }' # eol: 2024-11-12
        - '{ "tfm": "net7.0", "emsdk": "3.1.12" }' # eol: 2024-05-14
        - '{ "tfm": "net8.0", "emsdk": "3.1.34" }' # eol: 2026-11-10
        - '{ "tfm": "net9.0", "emsdk": "3.1.56" }' # eol: 2026-11-10
        - '{ "tfm": "net10.0", "emsdk": "3.1.56" }' # eol: 2028-11-14
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

    # -------------------------------------------------
    # Checkout repository
    # -------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        path: "cb"

    # -------------------------------------------------
    # Setup Emscripten
    # -------------------------------------------------
    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      with:
        version: ${{ fromJSON(matrix.config).emsdk }}

    # -------------------------------------------------
    # Setup .Net
    # -------------------------------------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0

    # -------------------------------------------------
    # Generate build script
    # -------------------------------------------------
    - name: Generate script
      run: dotnet run
      working-directory: cb/bld

    # -------------------------------------------------
    # Update permissions for build scripts
    # -------------------------------------------------
    - name: Update permissions
      run: chmod +x *.sh
      working-directory: cb/bld

    # -------------------------------------------------
    # Clean output directory
    # -------------------------------------------------
    - name: Clean output directory
      run: rm -fr bin
      working-directory: cb/bld

    # -------------------------------------------------
    # Build WASM binaries
    # -------------------------------------------------
    - name: Build (Wasm)
      run: |
        #!/bin/bash
        set -e
        for f in wasm_*.sh; do
          bash "$f" ${{ fromJSON(matrix.config).tfm }}
        done
      working-directory: cb/bld

    # -------------------------------------------------
    # Upload artifacts
    # -------------------------------------------------
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: bin-wasm-${{ fromJSON(matrix.config).tfm }}
        path: cb/bld/bin
