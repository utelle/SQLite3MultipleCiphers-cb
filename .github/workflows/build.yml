name: Build

on:
  push:
    branches: [ sqlite3mc, win-version-info ]
  pull_request:
    branches: [ sqlite3mc ]

jobs:
  build:
    # CI smoke build — no signing, no attestation
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-reusable.yml
    with:
      mode: sanity
    secrets:
      MUSL_CC_BIN: ${{ secrets.MUSL_CC_BIN }}
